name: OpenCMMC candidate build and native smoke

on:
  pull_request:
    paths:
      - '.github/workflows/opencmmc-release-candidate.yml'
      - 'scripts/*.py'
      - 'docs/PACKAGE_*.md'
      - 'scripts/start-cmmc-*.sh'
      - 'scripts/START-CMMC-*.cmd'
      - 'cmd/opencmmc/**'
      - 'tests/browser_e2e.mjs'
      - 'package.json'
      - 'internal/cmmc/**'
      - 'docs/DOWNLOADS.md'
  push:
    branches:
      - 'release/v1.0.0-rc.11'
      - 'ga/validation/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version v1.*; candidate version; publishing requires release branch and passing tests'
        required: true
        default: 'v1.0.0-rc.11'
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ (startsWith(github.ref, 'refs/heads/ga/validation/') || startsWith(github.head_ref, 'ga/validation/')) && 'v1.0.0' || (github.event.inputs.version || 'v1.0.0-rc.11') }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Validate candidate version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^v1\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || exit 1
      - name: Guard source branding
        run: python3 scripts/verify_distribution.py --source
      - name: Unit tests, race checks, and vet
        run: |
          go test ./...
          go test -race ./internal/cmmc ./cmd/opencmmc
          go vet ./...
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Fail closed on reachable Go security advisories
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Build Windows and Linux archives
        run: python3 scripts/package_release.py --version "$RELEASE_VERSION" --out dist
      - name: Generate SPDX and validate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/create_sbom.py --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA" --out dist/SBOM.spdx.json
          (cd dist && sha256sum SBOM.spdx.json >> SHA256SUMS && sha256sum SHA256SUMS > SHA256SUMS.sha256)
          (cd dist && sha256sum -c SHA256SUMS && sha256sum -c SHA256SUMS.sha256)
      - name: Verify OpenCMMC-only archive contents and manifest
        run: python3 scripts/verify_distribution.py --artifacts dist --version "$RELEASE_VERSION"
      - name: Sign exact release archive provenance with GitHub OIDC
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/opencmmc-*.zip
            dist/opencmmc-*.tar.gz
            dist/SBOM.spdx.json
      - name: Sign SBOM predicate against shipped archives
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/opencmmc-*.zip
            dist/opencmmc-*.tar.gz
          sbom-path: dist/SBOM.spdx.json
      - name: Preserve Sigstore signing bundles for offline verification
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          cp "$PROVENANCE_BUNDLE" dist/opencmmc-provenance.sigstore.json
          cp "$SBOM_BUNDLE" dist/opencmmc-sbom.sigstore.json
          (cd dist && sha256sum opencmmc-*.sigstore.json >> SHA256SUMS && sha256sum SHA256SUMS > SHA256SUMS.sha256)
          (cd dist && sha256sum -c SHA256SUMS && sha256sum -c SHA256SUMS.sha256)
      - name: Independently verify GitHub/Sigstore identity of signed GA drill archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          for kind in ('provenance','sbom'):
              with open(f'dist/opencmmc-{kind}.sigstore.json', encoding='utf-8') as fp:
                  bundle = json.load(fp)
              envelope = bundle.get('dsseEnvelope') or bundle.get('content',{}).get('dsseEnvelope')
              if not envelope:
                  raise SystemExit(f'GA BLOCKED: missing DSSE envelope in {kind} bundle')
              statement = json.loads(base64.b64decode(envelope['payload']))
              print(f'{kind} predicate: {statement.get("predicateType")}, subjects: {[x.get("name") for x in statement.get("subject",[])]}')
          PY
          for archive in dist/opencmmc-*.zip dist/opencmmc-*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle dist/opencmmc-provenance.sigstore.json \
              --predicate-type https://slsa.dev/provenance/v1 \
              --format json > /dev/null
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle dist/opencmmc-sbom.sigstore.json \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --format json > /dev/null
          done
          echo "PASS: independently verified signed provenance and SBOM identity for all four artifacts"
      - name: Upload candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencmmc-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
  smoke-windows:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            arch: arm64
          - runner: windows-latest
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Native UI and CSRF regression tests
        run: go test ./cmd/opencmmc ./internal/cmmc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencmmc-candidate
          path: dist
      - name: Run actual Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "dist/opencmmc-$env:RELEASE_VERSION-windows-${{ matrix.arch }}.zip" -DestinationPath smoke
          Push-Location smoke
          $ver = & .\opencmmc.exe version
          if ($LASTEXITCODE -ne 0 -or $ver -ne "OpenCMMC $env:RELEASE_VERSION") { throw "Wrong packaged executable version: $ver" }
          & .\opencmmc.exe cmmc init --level 2 --scope "Synthetic Windows test" --out workspace.json
          if ($LASTEXITCODE -ne 0) { throw "Init failed" }
          New-Item -ItemType Directory evidence | Out-Null
          & .\opencmmc.exe cmmc assess --input workspace.json --evidence-dir evidence --json readiness.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path readiness.json)) { throw "Report failed" }
          # Installed binary must restore actual user data, not merely pass Go tests.
          & .\opencmmc.exe cmmc init --level 1 --scope "Synthetic backup acceptance" --out backup-source-requirements.json
          if ($LASTEXITCODE -ne 0) { throw "Level 1 backup fixture init failed" }
          New-Item -ItemType Directory -Path backup-source/evidence -Force | Out-Null
          Move-Item backup-source-requirements.json backup-source/requirements.json
          Set-Content -Path backup-source/state.json -Value '{"mode":"basic","level":1}' -Encoding ascii
          & .\opencmmc.exe cmmc backup --data-dir backup-source --archive backup.zip
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path backup.zip)) { throw "Native backup failed" }
          & .\opencmmc.exe cmmc verify-backup --archive backup.zip
          if ($LASTEXITCODE -ne 0) { throw "Native backup verification failed" }
          & .\opencmmc.exe cmmc restore-backup --archive backup.zip --out-dir backup-restored
          if ($LASTEXITCODE -ne 0) { throw "Native restore failed" }
          $original = (Get-FileHash backup-source/requirements.json -Algorithm SHA256).Hash
          $restored = (Get-FileHash backup-restored/requirements.json -Algorithm SHA256).Hash
          if ($original -ne $restored) { throw "Native restore changed assessment bytes" }
          # This second restore MUST fail. PowerShell's Stop preference
          # can otherwise terminate on expected stderr before we check exit code.
          $ErrorActionPreference = 'Continue'
          & .\opencmmc.exe cmmc restore-backup --archive backup.zip --out-dir backup-restored 2>$null
          $negativeExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($negativeExit -eq 0) { throw "Existing assessment was overwritten" }
          if (-not (Test-Path backup-restored/requirements.json)) { throw "Rejected restore damaged existing assessment" }
          # GitHub's pwsh wrapper exits using LASTEXITCODE at script end,
          # including this intentionally nonzero negative-path check.
          $global:LASTEXITCODE = 0
          Pop-Location
  smoke-linux:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencmmc-candidate
          path: dist
      - name: Run actual Linux package
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "dist/opencmmc-$RELEASE_VERSION-linux-${{ matrix.arch }}.tar.gz" -C smoke
          cd smoke
          ./opencmmc version | grep -Fx "OpenCMMC $RELEASE_VERSION"
          ./opencmmc cmmc init --level 2 --scope "Synthetic Linux test" --out workspace.json
          mkdir evidence
          ./opencmmc cmmc assess --input workspace.json --evidence-dir evidence --json readiness.json
          test -s readiness.json

          # Verify backup, restore and overwrite refusal from the shipped binary.
          mkdir -p backup-source/evidence
          ./opencmmc cmmc init --level 1 --scope "Synthetic backup acceptance" --out backup-source/requirements.json
          printf '%s\n' '{"mode":"basic","level":1}' > backup-source/state.json
          ./opencmmc cmmc backup --data-dir backup-source --archive backup.zip
          ./opencmmc cmmc verify-backup --archive backup.zip
          ./opencmmc cmmc restore-backup --archive backup.zip --out-dir backup-restored
          cmp backup-source/requirements.json backup-restored/requirements.json
          cmp backup-source/state.json backup-restored/state.json
          if ./opencmmc cmmc restore-backup --archive backup.zip --out-dir backup-restored; then
            echo "ERROR: existing assessment overwritten" >&2
            exit 1
          fi
          # Level 2 objective workspace also has a verified restore path.
          mkdir -p level2-source/evidence
          ./opencmmc cmmc objectives-init --level 2 --scope "Synthetic objective backup" --out level2-source/objectives.json
          printf '%s\n' '{"mode":"objectives","level":2}' > level2-source/state.json
          ./opencmmc cmmc backup --data-dir level2-source --archive level2.zip
          ./opencmmc cmmc verify-backup --archive level2.zip
          ./opencmmc cmmc restore-backup --archive level2.zip --out-dir level2-restored
          cmp level2-source/objectives.json level2-restored/objectives.json

  browser-e2e:
    name: Real Chromium offline workbench acceptance
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build exact source for browser run
        run: go build -trimpath -o opencmmc-e2e ./cmd/opencmmc
      - name: Install pinned test-only Chromium
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run real browser form, evidence, forwarding and export acceptance
        run: OPENCMMC_BIN="$PWD/opencmmc-e2e" npm run test:browser

  publish-prerelease:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v1.0.0-rc.11' }}"
    needs: [package, smoke-windows, smoke-linux, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencmmc-candidate
          path: dist
      - name: Verify candidate package integrity before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS.sha256
          test -s SBOM.spdx.json
          test -f opencmmc-v1.0.0-rc.11-windows-arm64.zip
          test -f opencmmc-v1.0.0-rc.11-windows-amd64.zip
          test -f opencmmc-v1.0.0-rc.11-linux-arm64.tar.gz
          test -f opencmmc-v1.0.0-rc.11-linux-amd64.tar.gz
          test -s opencmmc-provenance.sigstore.json
          test -s opencmmc-sbom.sigstore.json
      - name: Create public release candidate after all native checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/v1.0.0-rc.11'
          if gh release view v1.0.0-rc.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release candidate already exists; refusing to replace.' >&2
            exit 1
          fi
          gh release create v1.0.0-rc.11 \
            dist/opencmmc-v1.0.0-rc.11-*.zip dist/opencmmc-v1.0.0-rc.11-*.tar.gz \
            dist/SHA256SUMS dist/SHA256SUMS.sha256 dist/SBOM.spdx.json \
            dist/opencmmc-provenance.sigstore.json dist/opencmmc-sbom.sigstore.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'OpenCMMC v1.0.0-rc.11 | Chromium Browser Form Reliability' \
            --notes-file docs/RELEASE_NOTES_v1.0.0-rc.11.md \
            --prerelease --latest=false
