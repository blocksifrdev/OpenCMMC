name: OpenCMMC CodeQL security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Go, Python and JavaScript security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use supported patched Go compiler
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Initialize advanced CodeQL analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go,python,javascript-typescript
          queries: security-extended
      - name: Compile actual Go entrypoints for analysis
        run: go build ./cmd/...
      - name: Analyze source and publish findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go-python-javascript
