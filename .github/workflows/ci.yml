name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Repository evidence scan
        run: go run ./cmd/freecompliance scan --path . --json report.json --html report.html --fail-on-gap
